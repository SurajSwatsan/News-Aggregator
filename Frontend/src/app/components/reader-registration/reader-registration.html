<div class="registration-wrapper">
  <!-- Central Card -->
  <div class="registration-card">
    
    <!-- Left Side: Form Area -->
    <div class="form-side">
      <div class="form-header">
        <h1>Get into it today</h1>
        <p class="subtitle">There is no charge or obligation upon registration</p>
      </div>



      @if (errorMessage()) {
        <div class="error-msg">{{ errorMessage() }}</div>
      }

      <form (submit)="onSubmit($event)" class="registration-form">

        <!-- 2-Column Grid -->
        <div class="input-grid">
          <div class="input-group">
            <label for="name">First Name</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <input type="text" id="name" [(ngModel)]="name" name="name" required placeholder="First Name">
            </div>
          </div>
          <div class="input-group">
            <label for="username">Last Name (Username)</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              <input type="text" id="username" [(ngModel)]="username" name="username" required placeholder="User Name">
            </div>
          </div>

          <div class="input-group">
            <label for="phone">Phone number</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              <input type="tel" id="phone" [(ngModel)]="phone" name="phone" required placeholder="+91">
            </div>
          </div>
          <div class="input-group">
            <label for="email">E-mail Address</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="email@example.com">
            </div>
          </div>

          <div class="input-group full-width">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="Enter strong password">
            </div>
          </div>

          <!-- Simple Checkbox for User Role -->
          <div class="input-group full-width user-checkbox-container">
            <label class="custom-checkbox-container">
              <input type="checkbox" id="userToggle" [checked]="role() === 'publisher'" (change)="toggleUserRole($event)">
              <span class="checkmark"></span>
              <span class="checkbox-text">Users (Select this if you are a publisher)</span>
            </label>
          </div>
        </div>

        <!-- Conditional Role Fields -->
        @if (role() === 'publisher' || role() === 'admin') {
          <div class="additional-fields-section">
            <div class="section-title">Publisher Information</div>
            <div class="input-grid additional-fields">
              
              <!-- Row 1: Email -->
              <div class="input-group full-width">
                <label for="pEmail">E-mail Address</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                  <input type="email" id="pEmail" [(ngModel)]="email" name="email" required placeholder="email@example.com">
                </div>
              </div>

              <!-- Row 2: First & Last Name -->
              <div class="input-group">
                <label>First Name</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                  <input type="text" [(ngModel)]="publisherFirstName" name="publisherFirstName" required placeholder="First Name">
                </div>
              </div>
              <div class="input-group">
                <label>Last Name</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                  <input type="text" [(ngModel)]="publisherLastName" name="publisherLastName" required placeholder="Last Name">
                </div>
              </div>

              <!-- Row 3: Organization & Website -->
              <div class="input-group">
                <label>Organization</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                  <input type="text" [(ngModel)]="orgName" name="orgName" required placeholder="Company">
                </div>
              </div>
              <div class="input-group">
                <label>Official Website</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                  <input type="url" [(ngModel)]="orgWebsite" name="orgWebsite" required placeholder="https://">
                </div>
              </div>

              <!-- Row 4: RSS Feed (Full Width) -->
              <div class="input-group full-width">
                <label>RSS Feed URL (Optional)</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"></path><path d="M4 4a16 16 0 0 1 16 16"></path><circle cx="5" cy="19" r="1"></circle></svg>
                  <input type="url" [(ngModel)]="rssUrl" name="rssUrl" placeholder="http://feed-url.com/rss.xml">
                </div>
              </div>

              <!-- Row 5: Country & City -->
              <div class="input-group">
                <label>Country</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                  <input type="text" [(ngModel)]="country" name="country" required placeholder="Country">
                </div>
              </div>
              <div class="input-group">
                <label>City</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                  <input type="text" [(ngModel)]="city" name="city" required placeholder="City">
                </div>
              </div>

              <!-- Row 6: Phone Number (Full Width) -->
              <div class="input-group full-width">
                <label>Phone Number</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                  <input type="tel" [(ngModel)]="phone" name="phone" required placeholder="Phone Number">
                </div>
              </div>

              <!-- Row 7: Business Registration -->
              <div class="input-group full-width">
                <label>Business Registration (PDF/Image)</label>
                <div class="input-wrapper">
                  <svg xmlns="http://www.w3.org/2000/svg" class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                  <input type="text" [(ngModel)]="businessDoc" name="businessDoc" required placeholder="Document URL or Reference">
                </div>
              </div>
            </div>
          </div>
        }

        <!-- Terms and Submit -->
        <div class="form-footer-section">
          <div class="terms-group">
            <label class="custom-checkbox-container">
              <input type="checkbox" id="terms" required>
              <span class="checkmark"></span>
              <span class="checkbox-text">I agree with <a href="#" (click)="$event.preventDefault()">Terms and Conditions</a></span>
            </label>
          </div>

          <div class="action-row">
            <button type="submit" class="btn-premium-register" [disabled]="isLoading()">
              {{ isLoading() ? 'Registering...' : 'Register Now' }}
            </button>
            <div class="login-prompt">
              Already have an account? <a routerLink="/login">LOG IN</a>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Right Side: Custom SVG Illustration mimicking the provided image -->
    <div class="image-side">
      <div class="vector-container">
        <svg viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" class="hero-vector">
          <!-- Background Abstract Elements -->
          <circle cx="650" cy="150" r="100" fill="#f0f5fa" opacity="0.6"/>
          
          <!-- Large Background Gears -->
          <g transform="translate(400, 150) rotate(15)" opacity="0.4">
            <path d="M120,50 L140,20 L180,20 L200,50 L230,60 L260,40 L290,70 L270,100 L280,130 L310,150 L310,190 L280,210 L270,240 L290,270 L260,300 L230,280 L200,290 L180,320 L140,320 L120,290 L90,280 L60,300 L30,270 L50,240 L40,210 L10,190 L10,150 L40,130 L50,100 L30,70 L60,40 L90,60 Z" fill="#b0c4de"/>
            <circle cx="160" cy="170" r="60" fill="#ffffff" stroke="#b0c4de" stroke-width="15"/>
          </g>
          <g transform="translate(100, 350) rotate(-10)" opacity="0.3">
            <path d="M80,30 L95,10 L125,10 L140,30 L165,40 L185,25 L210,50 L195,75 L205,100 L230,115 L230,145 L205,160 L195,185 L210,210 L185,235 L165,220 L140,230 L125,250 L95,250 L80,230 L55,220 L35,235 L10,210 L25,185 L15,160 L-10,145 L-10,115 L15,100 L25,75 L10,50 L35,25 L55,40 Z" fill="#90a4ae"/>
            <circle cx="110" cy="130" r="40" fill="#ffffff" stroke="#90a4ae" stroke-width="10"/>
          </g>

          <!-- Checkbox UI Element floating -->
          <g class="float-slow" transform="translate(680, 150)">
            <rect x="0" y="0" width="30" height="30" rx="6" fill="#ffffff" stroke="#4aa3f0" stroke-width="2"/>
            <path d="M6,15 L12,21 L24,9" stroke="#ff7b72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="40" y="0" width="30" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
          </g>

          <!-- Floating Profile Cards -->
          <!-- Card 1 (Left) -->
          <g class="float-med" transform="translate(180, 200)">
            <rect x="0" y="0" width="100" height="140" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
            <circle cx="50" cy="40" r="25" fill="#fef08a"/>
            <!-- Woman Silhouette -->
            <path d="M25,70 C25,40 75,40 75,70" fill="#3b5998"/>
            <circle cx="50" cy="35" r="15" fill="#e79975"/>
            <path d="M30,35 C30,20 70,20 70,35" fill="#0f172a"/>
            <!-- Lines under profile -->
            <rect x="30" y="80" width="40" height="4" rx="2" fill="#94a3b8"/>
            <rect x="20" y="90" width="60" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="20" y="100" width="60" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="20" y="110" width="60" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="20" y="120" width="60" height="4" rx="2" fill="#cbd5e1"/>
          </g>

          <!-- Card 2 (Center, Higher, Highlighted) -->
          <g class="float-slow" transform="translate(280, 160)">
            <rect x="0" y="0" width="120" height="180" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
            <!-- Frame shadow -->
            <rect x="-10" y="10" width="140" height="160" fill="none" stroke="#4aa3f0" stroke-width="2" opacity="0.5"/>
            <circle cx="60" cy="50" r="30" fill="#fef08a"/>
            <!-- Man Silhouette -->
            <path d="M30,85 C30,50 90,50 90,85" fill="#e2e8f0"/>
            <path d="M55,85 L60,105 L65,85 Z" fill="#ef4444"/> <!-- tie -->
            <circle cx="60" cy="45" r="18" fill="#fca5a5"/>
            <path d="M40,40 C40,25 80,25 80,40" fill="#1e293b"/>
            <!-- Lines -->
            <rect x="40" y="100" width="40" height="6" rx="3" fill="#3b82f6"/>
            <!-- Stars -->
            <path d="M35,120 L40,115 L45,120 L43,112 L48,107 L40,107 L38,98 L35,107 L28,107 L33,112 Z" fill="#3b82f6"/>
            <path d="M50,120 L55,115 L60,120 L58,112 L63,107 L55,107 L53,98 L50,107 L43,107 L48,112 Z" fill="#3b82f6"/>
            <path d="M65,120 L70,115 L75,120 L73,112 L78,107 L70,107 L68,98 L65,107 L58,107 L63,112 Z" fill="#3b82f6"/>
            <path d="M80,120 L85,115 L90,120 L88,112 L93,107 L85,107 L83,98 L80,107 L73,107 L78,112 Z" fill="#3b82f6"/>
            <!-- More Lines -->
            <rect x="25" y="140" width="70" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="25" y="150" width="70" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="25" y="160" width="70" height="4" rx="2" fill="#cbd5e1"/>
          </g>

          <!-- Card 3 (Right) -->
          <g class="float-fast" transform="translate(410, 200)">
            <rect x="0" y="0" width="100" height="140" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
            <circle cx="50" cy="40" r="25" fill="#ffedd5"/>
            <!-- Woman Silhouette -->
            <path d="M25,70 C25,40 75,40 75,70" fill="#ef4444"/>
            <circle cx="50" cy="35" r="15" fill="#fca5a5"/>
            <path d="M30,50 C30,10 70,10 70,50" fill="#92400e"/> <!-- Long hair -->
            <!-- Lines under profile -->
            <rect x="30" y="80" width="40" height="4" rx="2" fill="#94a3b8"/>
            <rect x="20" y="90" width="60" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="20" y="100" width="60" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="20" y="110" width="60" height="4" rx="2" fill="#cbd5e1"/>
            <rect x="20" y="120" width="60" height="4" rx="2" fill="#cbd5e1"/>
          </g>

          <!-- Desk and Floor -->
          <rect x="200" y="520" width="400" height="20" fill="#f1f5f9" rx="10"/>

          <!-- Student sitting at desk -->
          <g transform="translate(420, 250)">
            <!-- Plant -->
            <path d="M230,250 C230,200 280,180 280,180 C260,200 270,220 230,250 Z" fill="#86efac"/>
            <path d="M240,260 C240,210 210,190 210,190 C220,220 230,240 240,260 Z" fill="#4ade80"/>
            <path d="M245,260 C245,200 290,170 290,170 C270,190 260,220 245,260 Z" fill="#22c55e"/>
            <rect x="225" y="250" width="30" height="25" rx="4" fill="#3b82f6"/>

            <!-- Desk -->
            <rect x="-80" y="180" width="180" height="8" fill="#1e293b"/>
            <!-- Desk Legs -->
            <line x1="-50" y1="188" x2="-60" y2="280" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
            <line x1="80" y1="188" x2="60" y2="280" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Laptop -->
            <path d="M-10,180 L-40,130 L-35,128 L-5,178 Z" fill="#94a3b8"/>
            <rect x="-30" y="176" width="60" height="4" fill="#cbd5e1"/>

            <!-- Chair -->
            <path d="M120,200 L110,240 L160,240" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="120" y1="200" x2="160" y2="150" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="110" y1="240" x2="100" y2="280" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <line x1="160" y1="240" x2="170" y2="280" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
            <circle cx="100" cy="280" r="4" fill="#334155"/>
            <circle cx="170" cy="280" r="4" fill="#334155"/>

            <!-- Character Body -->
            <!-- Pants/Legs -->
            <path d="M100,200 C80,240 40,280 40,280" fill="none" stroke="#60a5fa" stroke-width="20" stroke-linecap="round"/>
            <path d="M110,200 C120,230 140,280 140,280" fill="none" stroke="#60a5fa" stroke-width="20" stroke-linecap="round"/>
            <!-- Shoes -->
            <path d="M35,275 L20,285 L30,290 L50,280 Z" fill="#f59e0b"/>
            <path d="M135,275 L150,285 L160,290 L140,280 Z" fill="#f59e0b"/>
            
            <!-- Torso -->
            <path d="M120,120 C100,160 80,200 110,210 C130,210 140,160 120,120" fill="#ef4444"/>
            <!-- White vest underneath -->
            <path d="M110,120 C90,160 90,130 95,180 C110,190 125,180 120,120" fill="#f8fafc"/>
            <path d="M120,120 C100,160 80,200 110,210 C130,210 140,160 120,120" fill="none" stroke="#ef4444" stroke-width="15"/>

            <!-- Right Arm -->
            <path d="M100,130 C100,130 70,160 60,150 C50,140 -10,180 -10,180" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Left Arm -->
            <path d="M130,135 C130,135 150,160 160,180" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>

            <!-- Hands -->
            <circle cx="-15" cy="180" r="6" fill="#fca5a5"/>

            <!-- Head & Hair -->
            <!-- Back Hair (Pony tail) -->
            <path d="M130,100 C160,100 190,110 170,150 C150,190 130,120 130,100" fill="#1e293b"/>
            <circle cx="115" cy="100" r="22" fill="#fca5a5"/> <!-- Face -->
            <!-- Front Hair -->
            <path d="M100,100 C100,70 140,70 140,100 C140,120 120,95 100,100" fill="#1e293b"/>
          </g>

        </svg>
      </div>
    </div>
  </div>
</div>
