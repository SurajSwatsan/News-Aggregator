<div class="edit-profile-wrapper">
  <div class="linkedin-container">
    <div class="nav-control">
      <button class="nav-back-button" (click)="cancel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span>Back to Profile</span>
      </button>
    </div>

    <div class="premium-card section-card">
      <div class="section-header">
        <h3 class="section-title">Edit Profile</h3>
        <p class="section-subtitle">Update your personal information to map with your active subscriptions.</p>
      </div>

      <div class="form-container">
        <div class="form-group row-flex">
          <div class="input-block">
            <label class="form-label">First Name</label>
            <input type="text" class="form-input" [(ngModel)]="editData.firstName" placeholder="First Name">
          </div>
          <div class="input-block">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-input" [(ngModel)]="editData.lastName" placeholder="Last Name">
          </div>
        </div>

        <div class="form-group readonly">
          <label class="form-label">Email Address (Cannot Edit)</label>
          <div class="static-value">{{ user()?.email }}</div>
        </div>

        <div class="form-actions">
          <button class="btn-cancel" (click)="cancel()">Cancel</button>
          <button class="btn-save" (click)="saveProfile()" [disabled]="isLoading">
            {{ isLoading ? 'Saving...' : 'Save Changes' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
