@if (ad()) {
  <div class="ad-container" [class]="placementType" (click)="onAdClick()">
    <div class="ad-label">ADVERTISEMENT</div>
    <div class="ad-content">
      @if (ad().adType === 'video') {
        <video #adVideo [src]="ad().mediaUrl" autoplay muted loop playsinline preload="auto" (loadeddata)="onVideoLoaded($event)" (canplay)="onVideoLoaded($event)" (error)="handleMediaError()" (click)="toggleVideo($event)"></video>
        @if (isPaused()) {
          <img src="assets/images/medithon-thumbnail.png" class="video-thumbnail" alt="Video Preview">
          <div class="video-overlay" (click)="toggleVideo($event)">
            <div class="play-icon">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
        }
      } @else if (ad().adType === 'html' || ad().mediaUrl.endsWith('.html')) {
        <iframe [src]="getSafeUrl(ad().mediaUrl)" style="width:100%; height:100%; border:none; border-radius:inherit; display:block;" scrolling="no" (error)="handleMediaError()"></iframe>
      } @else if (ad().adType === 'text') {
        <div class="text-ad-body">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" class="type-icon">
            <path d="M4 7h16M4 12h16M4 17h10"/>
          </svg>
          <span class="sponsored-link">Sponsored Content</span>
        </div>
      } @else {
        <img [src]="ad().mediaUrl" [alt]="ad().title" (error)="handleMediaError()">
      }
    </div>
  </div>
} @else if (isLoading()) {
  <div class="ad-skeleton" [class]="placementType"></div>
}
