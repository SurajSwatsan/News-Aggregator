<div class="login-wrapper">
  <!-- Left Side: Form Container -->
  <div class="form-side">
    <div class="form-container">

      <!-- Brand Logo -->
      <div class="brand">
        <div class="brand-logo">
          <img src="logo-yellow.svg" alt="iofrm logo">
        </div>
      </div>

      <!-- Main Copy -->
      <div class="copy-section">
        <h1>Get more things done with<br>Loggin platform.</h1>
        <p>Access to the most powerfull tool in the<br>entire design and web industry.</p>
      </div>

      @if (errorMessage()) {
      <div class="error-msg">{{ errorMessage() }}</div>
      }

      <form (submit)="onSubmit($event)">
        <!-- Inputs -->
        <div class="form-group">
          <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="E-mail Address" required>
        </div>

        <div class="form-group">
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Password" required>
        </div>

        <!-- Buttons -->
        <div class="action-buttons">
          <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
            {{ isLoading() ? 'Logging in...' : 'Login' }}
          </button>
          <button type="button" class="btn btn-outline" routerLink="/register">Create account</button>
        </div>

        <!-- Register Link -->
        <div class="footer-link">
          Don't have an account? <a routerLink="/register">Register here</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Right Side: Beautiful Vector Art Container -->
  <div class="image-side">
    <div class="vector-container">
      <!-- Original template graphic -->
      <img src="graphic15.svg" alt="Graphic" class="hero-vector">
    </div>
  </div>
</div>
