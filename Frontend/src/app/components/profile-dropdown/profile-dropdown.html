<div class="nav-right" (click)="$event.stopPropagation()">
    <div class="profile-trigger" (click)="toggleProfileMenu($event)" [class.active]="isProfileMenuOpen()">
        <div class="avatar-sm">{{ getAvatarInitials(user()?.name || user()?.email) }}</div>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="chevron-icon"
            [class.rotate]="isProfileMenuOpen()">
            <polyline points="6 9 12 15 18 9" />
        </svg>
    </div>

    <!-- Dropdown Menu -->
    @if (isProfileMenuOpen()) {
    <div class="profile-dropdown animate-fade-in">
        <div class="dropdown-header-premium">
            <div class="avatar-pill">{{ getAvatarInitials(user()?.name || user()?.email) }}</div>
            <div class="user-info">
                <div class="user-display-name">{{ (user()?.name || 'News Reader') | uppercase }}</div>
                <div class="user-display-email">{{ user()?.email | lowercase }}</div>
            </div>
        </div>

        <div class="dropdown-menu-list">
            <a class="menu-item" (click)="isProfileMenuOpen.set(false)" [routerLink]="user()?.role === 'admin' ? '/user' : (user()?.role === 'publisher' ? '/publisher/settings' : '/')">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="menu-icon">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span>MY PROFILE</span>
            </a>
            <a *ngIf="user()?.role === 'publisher'" class="menu-item" (click)="isProfileMenuOpen.set(false)" routerLink="/publisher/feeds">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" 
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
                    class="menu-icon">
                    <path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/>
                </svg>
                <span>FEEDS</span>
            </a>
            <a class="menu-item" (click)="isProfileMenuOpen.set(false)" [routerLink]="user()?.role === 'admin' ? '/user' : (user()?.role === 'publisher' ? '/publisher/settings' : '/')">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="menu-icon">
                    <path
                        d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                <span>SETTINGS</span>
            </a>

            <div class="menu-item lang-selector">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="menu-icon">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="2" x2="22" y1="12" y2="12" />
                    <path
                        d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                </svg>
                <div class="lang-select-wrapper">
                    <select class="premium-select">
                        <option>English</option>
                    </select>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="select-chevron">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </div>
            </div>

            <div class="menu-divider"></div>

            <button class="logout-link" (click)="logout()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" x2="9" y1="12" y2="12" />
                </svg>
                <span>Logout</span>
            </button>
        </div>
    </div>
    }
</div>
