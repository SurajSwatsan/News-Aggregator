<div class="notification-wrapper">
  <button class="bell-btn" (click)="toggleDropdown()" [class.has-unread]="notificationService.unreadCount() > 0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span class="badge" *ngIf="notificationService.unreadCount() > 0">{{ notificationService.unreadCount() }}</span>
  </button>

  <div class="dropdown-panel" *ngIf="isOpen()" [class.panel-open]="isOpen()">
    <div class="panel-header">
      <h3>Notifications</h3>
      <button class="mark-all-btn" (click)="markAllAsRead()">Mark all as read</button>
    </div>

    <div class="notifications-list" [class.empty]="notificationService.notifications().length === 0">
      <div *ngIf="notificationService.notifications().length === 0" class="empty-state">
        <p>No notifications yet</p>
      </div>

      <div *ngFor="let n of notificationService.notifications()" 
           class="notification-item" 
           [class.unread]="!n.isRead"
           (click)="handleNotificationClick(n)"
           [attr.data-type]="n.type">
        <div class="noti-icon">
          <div [ngSwitch]="n.type">
            <svg *ngSwitchCase="'PAYMENT_SUCCESS'" viewBox="0 0 24 24" fill="none" class="success-icon"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </div>
        </div>
        <div class="noti-content">
          <h4 class="noti-title">{{ n.title }}</h4>
          <p class="noti-msg">{{ n.message }}</p>
          <span class="noti-time">{{ formatDate(n.createdAt) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
