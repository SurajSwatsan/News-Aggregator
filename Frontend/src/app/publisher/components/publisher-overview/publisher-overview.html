<div class="overview-container animate-fade">
  <!-- DASHBOARD VIEW -->
  <ng-container *ngIf="view() === 'dashboard'">
    <div class="metrics-grid">
      <div *ngFor="let metric of metrics()" class="metric-card-horizontal">
        <div class="metric-icon-bg">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="metric.icon"></path>
          </svg>
        </div>
        <div class="metric-info">
          <span class="metric-label">{{ metric.label }}</span>
          <div class="metric-value-row">
            <span class="metric-value">{{ metric.value }}</span>
            <span class="status-badge positive">+12%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Performance Overview Section -->
    <div class="chart-section mt-6">
      <div class="section-header">
        <h2>Performance Overview</h2>
        <select class="clean-select-sm">
          <option>Last 7 Days</option>
          <option>Last 30 Days</option>
          <option>Last 90 Days</option>
        </select>
      </div>
      <div class="chart-box">
        <div class="placeholder-chart">
          <p>Traffic Analytics Visualization</p>
        </div>
      </div>
    </div>
  </ng-container>


  <!-- SETTINGS VIEW -->
  <ng-container *ngIf="view() === 'settings'">
    <div class="settings-card">
      <div class="card-header">
        <h2>Newspaper Settings</h2>
        <button class="btn-primary" (click)="updateSource()" [disabled]="isSaving()">
          {{ isSaving() ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>

      <div class="settings-form mt-4">
        <div class="form-group">
          <label>Newspaper Name</label>
          <input type="text" [(ngModel)]="source().name" class="clean-input">
        </div>

        <div class="form-group mt-4">
          <label>Homepage URL</label>
          <input type="url" [(ngModel)]="source().url" class="clean-input">
        </div>

        <div class="form-group mt-4">
          <label>Description</label>
          <textarea [(ngModel)]="source().description" class="clean-textarea" rows="4"></textarea>
        </div>
      </div>
    </div>
  </ng-container>
</div>
